version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: workhub-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: workhub
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: workhub-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/workhub
      JWT_SECRET: supersecretjwtkeyworkhub2026production!
      JWT_REFRESH_SECRET: supersecretrefreshkeyworkhub2026production!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
